<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreCard</title>
    <link rel="stylesheet" href="1st.css">
</head>
<body>
    <div class="main">
        <div class="team">
            <span>Team A</span>
            <span>Team B</span>
        
        </div>
        <div class="displayContainer">
            <div class="scoreDisplay" id="score1">0</div>
            <div class="scoreDisplay" id="score2">0</div>
        </div>
        <div class="btnContainer">
        <div class="BTN">
            <button class="btn" onclick="a1()">+1</button>
            <button class="btn" onclick="a2()">+2</button>
            <button class="btn" onclick="a3()">+3</button>

        </div>
        <div class="BTN">
            <button class="btn" onclick="b1()">+1</button>
            <button class="btn" onclick="b2()">+2</button>
            <button class="btn" onclick="b3()">+3</button>

        </div>
        </div>

    </div>
    <script src="1st.js"></script>
</body>
</html>
